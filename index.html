<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TEMPO — рабочий день v4</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#292927;background:#f5f2ed}*{box-sizing:border-box}body{margin:0}.app{max-width:570px;margin:auto;padding:26px 18px 105px}.eyebrow{font-size:11px;letter-spacing:2px;color:#8a8177;font-weight:700}h1{font:normal 34px Georgia,serif;margin:9px 0}h2{font-size:17px;margin:0}p,.muted{color:#81796e;font-size:13px;line-height:1.5}.panel{background:#fffdfa;border:1px solid #e9e3d9;border-radius:21px;padding:18px;margin-top:14px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat strong{display:block;font-size:24px;margin:9px 0 4px}.stat{margin-top:0}.small{font-size:11px;color:#81796e}.head,.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.button{border:0;border-radius:12px;background:#34322f;color:white;padding:11px 14px;font:inherit;font-size:13px;cursor:pointer}.outline{border:1px solid #ded8cf;background:#fffdfa;color:#35322d}.days{display:flex;gap:7px;overflow-x:auto;margin:17px 0 6px}.day{min-width:51px;flex:1;background:#f7f4ef;border:1px solid #e7dfd4;border-radius:12px;padding:10px 5px;color:#625e58;cursor:pointer}.day.active{background:#34322f;color:white}.day small{display:block;margin-bottom:6px}.entry{display:flex;align-items:center;gap:10px;border-top:1px solid #eee9e2;padding:13px 0;cursor:pointer}.entry:first-child{border-top:0}.entry .details{flex:1;min-width:0}.entry b{font-size:13px}.entry small{display:block;color:#847b70;margin-top:4px}.entry .time{font-size:13px;font-weight:650}.tag{font-size:10px;padding:4px 7px;border-radius:9px;background:#eae4d9;white-space:nowrap}.tag.done{background:#e3ede4}.tag.cancelled{background:#f3e5e1}.tag.moved{background:#ece9f3}.empty{padding:24px 0;color:#8d8478;font-size:13px}.nav{position:fixed;bottom:0;left:0;right:0;background:#fffdfa;border-top:1px solid #e9e3d9;display:flex;justify-content:space-around;padding:12px 0 max(15px,env(safe-area-inset-bottom))}.nav button{background:none;border:0;color:#81796e;font-size:12px}.nav button.active{color:#292927;font-weight:700}dialog{border:0;border-radius:20px;padding:22px;width:calc(100% - 30px);max-width:470px;max-height:90vh;overflow:auto}dialog::backdrop{background:#29251f88}label{display:block;font-size:12px;color:#5e574e;margin:12px 0 5px}input,select{width:100%;padding:11px;border:1px solid #dcd4c9;border-radius:10px;background:white;font:inherit;font-size:14px}.formactions{display:flex;justify-content:flex-end;gap:8px;margin-top:19px;flex-wrap:wrap}.note{font-size:11px;text-align:center;margin:22px 0}.hint{background:#f6f2eb;border-radius:13px;padding:13px;margin-top:13px;font-size:13px;color:#635b52}.mode{display:flex;gap:8px;overflow-x:auto;margin-top:12px}.mode button{flex:1;min-width:95px;padding:10px 6px;border:1px solid #ded8ce;border-radius:10px;background:white;font-size:11px}.mode button.active{background:#34322f;color:white}button:focus-visible{outline:3px solid #a68c70;outline-offset:2px}
dialog{position:fixed;inset:0;margin:auto;max-height:90dvh;overflow:auto;z-index:1000;border:1px solid #ddd5ca;box-shadow:0 0 0 100vmax rgba(28,26,24,.58);width:calc(100% - 28px);max-width:480px;border-radius:20px;padding:22px;background:#f8f6f2}dialog:not([open]){display:none!important}dialog[open]{display:block!important}dialog input,dialog select{font-size:16px!important;min-height:44px}dialog .formactions{display:flex;flex-wrap:wrap;gap:8px}dialog .formactions button{min-height:44px}</style><style>
.app{padding-bottom:95px}.panel{margin-top:12px}.stats{margin-top:12px}.entry{display:grid;grid-template-columns:65px 1fr auto;gap:10px;align-items:center}.time-col strong{display:block;font-size:15px}.time-col small{display:block;font-size:11px;color:#8a8177;margin-top:3px}.entry .details small{line-height:1.4}.entry .price{font-size:12px;font-weight:700;white-space:nowrap}.entry .tag{display:inline-block;margin-top:5px}.schedule-grid[hidden]{display:none}.service-line{border:1px solid #e7dfd4;border-radius:13px;padding:12px;margin-top:10px;background:#fff}.service-line .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.service-line .row button{padding:5px 9px}.summary{display:flex;justify-content:space-between;gap:12px;padding:13px;background:#f0ebe3;border-radius:12px;margin-top:13px;font-size:13px}.summary strong{display:block;margin-top:4px}.minor{font-size:12px;color:#81796e}.toggle{background:transparent;color:#34322f;border:1px solid #ded8cf}.hidden{display:none!important}
</style></head><body><main class="app"><div class="topline"><strong>TEMPO</strong><button class="button outline" id="today">Сегодня</button></div><p id="dateLabel"></p><section class="panel calendar-panel"><div class="head"><h2 id="monthTitle">Календарь</h2><button class="button" id="add">+ Запись</button></div><div class="row calendar-controls"><button class="button outline" id="prev" aria-label="Предыдущий месяц">←</button><span class="small" id="range"></span><button class="button outline" id="next" aria-label="Следующий месяц">→</button></div><div class="month-grid" id="days"></div><div class="head schedule-heading"><h2>Расписание дня</h2><span class="small">09:00–21:00</span></div><div id="entries"></div></section><section class="total-strip"><strong>Итого за день</strong><strong id="actual">0 ₸</strong></section></main><nav class="nav"><button class="active">▦ Календарь</button><button onclick="alert('Клиентская база — следующий этап')">♙ Клиенты</button><button onclick="alert('Каталог услуг — следующий этап')">◈ Услуги</button><button onclick="alert('Дополнительные функции — следующий этап')">☷ Ещё</button></nav><dialog id="dlg"><form id="form"><h2 id="formTitle">Новая запись</h2><label for="clientName">Имя клиента</label><input id="clientName" name="name" required maxlength="50" placeholder="Например, Алия"><label for="clientDate">Дата</label><input id="clientDate" name="date" type="date" required><label for="clientTime">Время начала</label><input id="clientTime" name="time" type="time" required><div class="head services-heading"><h2>Услуги</h2><div class="picker-wrap"><button class="button outline" type="button" id="addService" aria-expanded="false">+ Услуга</button><div id="servicePicker" class="service-picker hidden" role="listbox"></div></div></div><div id="services"></div><div class="summary"><div>Общее время<strong id="totalDuration">0 мин</strong></div><div>Общая сумма<strong id="totalPrice">0 ₸</strong></div></div><label for="totalOverride">Итоговая сумма, ₸ (можно изменить)</label><input id="totalOverride" type="number" min="0" step="1" required><div class="formactions"><button type="button" class="button outline" id="delete" hidden>Удалить</button><button type="button" class="button outline" id="close">Закрыть</button><button class="button" type="submit">Сохранить</button></div></form></dialog><style>
.app{padding:18px 15px 95px}.topline{display:flex;align-items:center;justify-content:space-between;margin:2px 0 4px}.topline strong{font:normal 27px Georgia,serif;letter-spacing:1px}.app #dateLabel{margin:4px 0 10px}.calendar-panel{margin-top:10px;padding:15px}.calendar-controls{margin-top:13px}.month-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;margin-top:12px}.weekday{text-align:center;color:#81796e;font-size:11px;padding:4px 0}.month-day{border:0;border-radius:10px;min-height:43px;background:transparent;color:#34322f;font:inherit;font-size:14px;cursor:pointer;padding:5px 1px;position:relative}.month-day.other{color:#c5beb5}.month-day.offday{color:#db5555}.month-day.selected{background:#34322f;color:white}.month-day.today:not(.selected){outline:1px solid #aaa094}.month-day.has-bookings:after{content:'•';position:absolute;bottom:0;left:calc(50% - 3px);font-size:13px;color:#67a77a}.month-day.selected:after{color:#c4ebc8}.schedule-heading{margin:18px 0 10px}.slot-free{display:flex;align-items:center;justify-content:space-between;gap:7px;background:#edf5ee;border:1px solid #d8e9db;border-radius:13px;padding:12px;margin:8px 0;color:#37684b}.slot-free strong{font-size:13px}.slot-free small{display:block;font-size:12px;margin-top:3px}.slot-free button{padding:9px;font-weight:600;white-space:nowrap;background:#fff;color:#37684b;border:1px solid #a6c6ad}.slot-booked{display:grid;grid-template-columns:65px minmax(0,1fr) auto;gap:8px;align-items:center;padding:13px 2px;border-bottom:1px solid #e9e3d9;cursor:pointer}.slot-booked .details{min-width:0}.slot-booked .details b{font-size:13px}.slot-booked .details small{display:block;color:#81796e;font-size:12px;margin-top:4px;line-height:1.4}.slot-booked .price{font-size:12px;font-weight:700;white-space:nowrap}.slot-booked .time-col strong{font-size:14px}.slot-booked .time-col small{font-size:11px;color:#81796e}.total-strip{display:flex;justify-content:space-between;align-items:center;padding:14px 17px;background:#fffdfa;border:1px solid #e9e3d9;border-radius:15px;margin-top:10px;font-size:15px}.services-heading{margin-top:16px}.picker-wrap{position:relative}.service-picker{position:absolute;right:0;top:calc(100% + 5px);width:min(270px,78vw);max-height:310px;overflow-y:auto;z-index:30;background:white;border:1px solid #ded8cf;border-radius:13px;box-shadow:0 12px 35px #302a2240;padding:5px}.service-picker button{display:block;width:100%;background:white;border:0;text-align:left;padding:11px 9px;font-size:15px;border-radius:8px;color:#292927}.service-picker button:active,.service-picker button:focus{background:#f0ebe3}.service-line{margin-top:9px}.service-line select{min-width:0}dialog{overflow-y:auto;overflow-x:visible}#monthTitle{text-transform:capitalize}
</style><script>
const KEY='tempo_demo_v4',PREV='tempo_demo_v2',OLD='tempo_demo_v1';
const $=id=>document.getElementById(id),pad=n=>String(n).padStart(2,'0'),dateKey=d=>[d.getFullYear(),pad(d.getMonth()+1),pad(d.getDate())].join('-'),money=n=>Number(n||0).toLocaleString('ru-RU')+' ₸';
const catalog=[{name:'Маникюр',price:8000,duration:60},{name:'Маникюр с гелем',price:15000,duration:120},{name:'Педикюр',price:10000,duration:90},{name:'Педикюр с гелем',price:15000,duration:120},{name:'Наращивание',price:20000,duration:150},{name:'Укрепление',price:3000,duration:30},{name:'Дизайн ногтей',price:2000,duration:30},{name:'Другая услуга',price:0,duration:30}];
let selected=dateKey(new Date()),viewMonth=new Date().getMonth(),viewYear=new Date().getFullYear(),editId=null,records=[],lines=[],manualTotal=false;
function normalize(x,i){let services=Array.isArray(x.services)&&x.services.length?x.services.map(y=>({name:String(y.name||'Услуга'),price:Number(y.price)||0,duration:Number(y.duration)||0})):[{name:String(x.service||'Услуга'),price:Number(x.price)||0,duration:Number(x.duration)||60}];return {...x,id:String(x.id||'old'+i),services,duration:Number(x.duration)||services.reduce((a,b)=>a+b.duration,0),price:Number(x.price??services.reduce((a,b)=>a+b.price,0))||0,status:x.status||'planned'};}
try{let saved=JSON.parse(localStorage.getItem(KEY)||'null');if(saved?.records)records=saved.records.map(normalize);else{let prev=JSON.parse(localStorage.getItem(PREV)||'null');if(prev?.records)records=prev.records.map(normalize);else records=(JSON.parse(localStorage.getItem(OLD)||'[]')||[]).map(normalize)}}catch(e){console.warn(e)}
function persist(){try{localStorage.setItem(KEY,JSON.stringify({records}))}catch(e){alert('Не удалось сохранить данные в браузере')}}
const mins=t=>{let [h,m]=String(t||'00:00').split(':').map(Number);return h*60+m},clock=n=>pad(Math.floor(n/60)%24)+':'+pad(n%60),active=x=>!['cancelled','moved'].includes(x.status);
function freeDuration(n){let h=Math.floor(n/60),m=n%60;return (h?h+' ч':'')+(h&&m?' ':'')+(m?m+' мин':'')||'0 мин'}
function render(){const first=new Date(viewYear,viewMonth,1),monthName=new Intl.DateTimeFormat('ru-RU',{month:'long',year:'numeric'}).format(first);$('monthTitle').textContent=monthName[0].toUpperCase()+monthName.slice(1);$('range').textContent=monthName;const grid=$('days');grid.replaceChildren();for(let name of ['Пн','Вт','Ср','Чт','Пт','Сб','Вс']){let e=document.createElement('div');e.className='weekday';e.textContent=name;grid.append(e)}let start=(first.getDay()+6)%7;let count=Math.ceil((start+new Date(viewYear,viewMonth+1,0).getDate())/7)*7;for(let i=0;i<count;i++){let d=new Date(viewYear,viewMonth,i-start+1),key=dateKey(d),other=d.getMonth()!==viewMonth,b=document.createElement('button');b.type='button';b.className='month-day'+(other?' other':'')+(d.getDay()===3&&!other?' offday':'')+(key===selected?' selected':'')+(key===dateKey(new Date())?' today':'')+(records.some(x=>x.date===key&&active(x))?' has-bookings':'');b.textContent=d.getDate();b.setAttribute('aria-label',new Intl.DateTimeFormat('ru-RU',{day:'numeric',month:'long',year:'numeric'}).format(d));b.onclick=()=>{selected=key;viewMonth=d.getMonth();viewYear=d.getFullYear();render()};grid.append(b)}$('dateLabel').textContent=new Intl.DateTimeFormat('ru-RU',{weekday:'long',day:'numeric',month:'long'}).format(new Date(selected+'T12:00:00'));let rows=records.filter(x=>x.date===selected&&active(x)).sort((a,b)=>a.time.localeCompare(b.time));$('actual').textContent=money(rows.reduce((s,x)=>s+Number(x.price||0),0));let entries=$('entries');entries.replaceChildren();let cursor=540;function addFree(a,b){if(b<=a)return;let wrap=document.createElement('div');wrap.className='slot-free';let info=document.createElement('div');let title=document.createElement('strong');title.textContent=clock(a)+'–'+clock(b);let small=document.createElement('small');small.textContent='Свободно: '+freeDuration(b-a);info.append(title,small);let button=document.createElement('button');button.className='button';button.type='button';button.textContent='+ Запись';button.onclick=()=>openEdit(null,clock(a));wrap.append(info,button);entries.append(wrap)}for(let x of rows){let start=mins(x.time),end=start+Number(x.duration||0);if(start>cursor)addFree(cursor,Math.min(start,1260));let e=document.createElement('div');e.className='slot-booked';e.setAttribute('role','button');e.tabIndex=0;let t=document.createElement('div');t.className='time-col';let a=document.createElement('strong');a.textContent=x.time;let b=document.createElement('small');b.textContent=clock(end);t.append(a,b);let detail=document.createElement('div');detail.className='details';let n=document.createElement('b');n.textContent=x.name;let sv=document.createElement('small');sv.textContent=x.services.map(y=>y.name).join(' + ');detail.append(n,sv);let price=document.createElement('div');price.className='price';price.textContent=money(x.price);e.append(t,detail,price);e.onclick=()=>openEdit(x);e.onkeydown=ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();openEdit(x)}};entries.append(e);cursor=Math.max(cursor,end)}addFree(cursor,1260);if(!rows.length&&cursor>=1260){entries.textContent='На этот день свободного времени нет'}}
function serviceLine(line){let div=document.createElement('div');div.className='service-line';let head=document.createElement('div');head.className='row';let sel=document.createElement('select');sel.setAttribute('aria-label','Услуга');for(let c of catalog){let o=document.createElement('option');o.value=c.name;o.textContent=c.name;sel.append(o)}if(!catalog.some(c=>c.name===line.name)){let o=document.createElement('option');o.value=line.name;o.textContent=line.name;sel.append(o)}sel.value=line.name;sel.onchange=()=>{let c=catalog.find(c=>c.name===sel.value);line.name=sel.value;if(c){line.price=c.price;line.duration=c.duration}drawServices()};let del=document.createElement('button');del.type='button';del.className='button outline';del.textContent='×';del.setAttribute('aria-label','Удалить услугу');del.onclick=()=>{lines=lines.filter(x=>x!==line);drawServices()};head.append(sel,del);div.append(head);let two=document.createElement('div');two.className='two';for(let [field,label] of [['duration','Время, мин'],['price','Цена, ₸']]){let box=document.createElement('div');let lab=document.createElement('label');lab.textContent=label;let input=document.createElement('input');input.type='number';input.min='0';input.step='1';input.required=true;input.value=line[field];input.setAttribute('aria-label',label);input.oninput=()=>{line[field]=Number(input.value)||0;updateTotals()};box.append(lab,input);two.append(box)}div.append(two);return div}
function drawServices(){$('services').replaceChildren(...lines.map(serviceLine));updateTotals()}
function updateTotals(){let dur=lines.reduce((s,x)=>s+Number(x.duration||0),0),price=lines.reduce((s,x)=>s+Number(x.price||0),0);$('totalDuration').textContent=freeDuration(dur);$('totalPrice').textContent=money(price);if(!manualTotal)$('totalOverride').value=price}
$('totalOverride').oninput=()=>{manualTotal=true};
function closePicker(){$('servicePicker').classList.add('hidden');$('addService').setAttribute('aria-expanded','false')}
function openEdit(x,time){editId=x?.id||null;$('formTitle').textContent=x?'Изменить запись':'Новая запись';$('clientName').value=x?.name||'';$('clientDate').value=x?.date||selected;$('clientTime').value=x?.time||time||'11:00';lines=x?x.services.map(y=>({...y})):[];manualTotal=false;drawServices();if(x){$('totalOverride').value=x.price;manualTotal=Number(x.price)!==lines.reduce((s,y)=>s+Number(y.price),0)}$('delete').hidden=!x;closePicker();$('dlg').showModal()}
$('addService').onclick=()=>{let picker=$('servicePicker');let opening=picker.classList.contains('hidden');picker.classList.toggle('hidden',!opening);$('addService').setAttribute('aria-expanded',String(opening));if(opening){picker.replaceChildren();for(let c of catalog){let b=document.createElement('button');b.type='button';b.textContent=c.name;b.onclick=()=>{lines.push({...c});drawServices();closePicker()};picker.append(b)}}};
document.addEventListener('click',e=>{if(!e.target.closest('.picker-wrap'))closePicker()});$('add').onclick=()=>openEdit(null);$('close').onclick=()=>$('dlg').close();$('prev').onclick=()=>{let d=new Date(viewYear,viewMonth-1,1);viewYear=d.getFullYear();viewMonth=d.getMonth();selected=dateKey(d);render()};$('next').onclick=()=>{let d=new Date(viewYear,viewMonth+1,1);viewYear=d.getFullYear();viewMonth=d.getMonth();selected=dateKey(d);render()};$('today').onclick=()=>{let d=new Date();selected=dateKey(d);viewMonth=d.getMonth();viewYear=d.getFullYear();render()};
$('form').onsubmit=e=>{e.preventDefault();if(!lines.length){alert('Выберите услугу через кнопку «+ Услуга»');return}let duration=lines.reduce((s,x)=>s+Number(x.duration||0),0);if(duration<=0){alert('Укажите продолжительность услуг');return}let rec={id:editId||String(Date.now()),name:$('clientName').value.trim(),date:$('clientDate').value,time:$('clientTime').value,services:lines.map(x=>({...x})),duration,price:Number($('totalOverride').value),status:'planned'};let start=mins(rec.time),end=start+duration;if(records.some(x=>x.id!==editId&&x.date===rec.date&&active(x)&&start<mins(x.time)+Number(x.duration||60)&&end>mins(x.time))){if(!confirm('Сделать наложение записи?'))return}if(editId)records=records.map(x=>x.id===editId?rec:x);else records.push(rec);selected=rec.date;let d=new Date(selected+'T12:00:00');viewMonth=d.getMonth();viewYear=d.getFullYear();persist();$('dlg').close();render()};
$('delete').onclick=()=>{if(!editId||!confirm('Удалить запись клиента?'))return;records=records.filter(x=>x.id!==editId);persist();$('dlg').close();render()};
render();
</script></body></html>
